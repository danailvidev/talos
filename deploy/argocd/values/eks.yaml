# Replace all placeholders in the same commit that promotes an image.
controlPlane:
  image:
    repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/talos-control-plane
    digest: sha256:REPLACE_WITH_CONTROL_PLANE_DIGEST

workers:
  agent:
    image:
      repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/talos-agent-worker
      digest: sha256:REPLACE_WITH_AGENT_WORKER_DIGEST
  e2e:
    image:
      repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/talos-e2e-worker
      digest: sha256:REPLACE_WITH_E2E_WORKER_DIGEST

existingSecret:
  name: talos-secrets

persistence:
  storageClassName: talos-gp3-encrypted

runtime:
  publicUrl: https://talos.example.com
  artifactS3:
    bucket: replace-me-talos-artifacts
    region: us-east-1

serviceAccounts:
  controlPlane:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/talos-control-plane
  worker:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/talos-worker

ingress:
  enabled: false
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
  certificateArn: arn:aws:acm:us-east-1:000000000000:certificate/REPLACE_ME
  host: talos.example.com

# Keep disabled until the cluster/API/provider/QA CIDRs are known. Rendering
# fails closed when enabled with an empty list.
networkPolicies:
  enabled: false
  ingressCidrs: []
  kubernetesApiCidrs: []
  controlPlaneEgressCidrs: []
  workerEgressCidrs: []
