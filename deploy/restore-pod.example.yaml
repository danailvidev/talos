apiVersion: v1
kind: Pod
metadata:
  name: talos-restore
  namespace: talos
  labels:
    app.kubernetes.io/part-of: talos
    app.kubernetes.io/component: restore
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: restore
      image: REPLACE_WITH_CONTROL_PLANE_IMAGE_DIGEST
      command: ["sleep", "86400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: data
          mountPath: /var/lib/talos
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: talos-talos-data
    - name: tmp
      emptyDir: {}
