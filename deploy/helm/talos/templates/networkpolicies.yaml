{{- if .Values.networkPolicies.enabled }}
{{- if not .Values.networkPolicies.ingressCidrs }}
{{- fail "networkPolicies.ingressCidrs must be set when NetworkPolicies are enabled" }}
{{- end }}
{{- if not .Values.networkPolicies.kubernetesApiCidrs }}
{{- fail "networkPolicies.kubernetesApiCidrs must be set when NetworkPolicies are enabled" }}
{{- end }}
{{- if not .Values.networkPolicies.controlPlaneEgressCidrs }}
{{- fail "networkPolicies.controlPlaneEgressCidrs must be set when NetworkPolicies are enabled" }}
{{- end }}
{{- if not .Values.networkPolicies.workerEgressCidrs }}
{{- fail "networkPolicies.workerEgressCidrs must be set when NetworkPolicies are enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "talos.fullname" . }}-default-deny
  labels:
    {{- include "talos.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "talos.fullname" . }}-control-plane
  labels:
    {{- include "talos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "talos.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range .Values.networkPolicies.ingressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.controlPlane.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicies.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicies.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.networkPolicies.kubernetesApiCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicies.controlPlaneEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "talos.fullname" . }}-workers
  labels:
    {{- include "talos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      talos.managed: "true"
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicies.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicies.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.networkPolicies.workerEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
