{{- if .Values.serviceAccounts.controlPlane.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "talos.controlPlaneServiceAccountName" . }}
  labels:
    {{- include "talos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.controlPlane.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.serviceAccounts.worker.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "talos.workerServiceAccountName" . }}
  labels:
    {{- include "talos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.worker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "talos.fullname" . }}-executor
  labels:
    {{- include "talos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "talos.fullname" . }}-executor
  labels:
    {{- include "talos.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "talos.controlPlaneServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "talos.fullname" . }}-executor
