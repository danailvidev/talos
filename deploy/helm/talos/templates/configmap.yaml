apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talos.fullname" . }}-workflows
  labels:
    {{- include "talos.labels" . | nindent 4 }}
data:
  workflows.yaml: |
    database: /var/lib/talos/talos.db
    logLevel: {{ .Values.workflows.logLevel | quote }}
    timezone: {{ .Values.workflows.timezone | quote }}
    llm:
      provider: {{ .Values.workflows.llm.provider | quote }}
      maxTokens: {{ .Values.workflows.llm.maxTokens }}
