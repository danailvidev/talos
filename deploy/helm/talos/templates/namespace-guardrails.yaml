{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "talos.fullname" . }}
  labels:
    {{- include "talos.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}
{{- if .Values.limitRange.enabled }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "talos.fullname" . }}
  labels:
    {{- include "talos.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- toYaml .Values.limitRange.container | nindent 6 }}
{{- end }}
